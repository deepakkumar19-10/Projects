<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <input type="text" id="textarea" value="0" readonly>
        <h1>Calculate Smart, Not Hard.</h1>

        <div class="container">
            <div class="row special">AC</div>
            <div class="row special">%</div>
            <div class="row special">X</div>
            <div class="row operator">/</div>

            <div class="row number">7</div>
            <div class="row number">8</div>
            <div class="row number">9</div>
            <div class="row operator">*</div>

            <div class="row number">4</div>
            <div class="row number">5</div>
            <div class="row number">6</div>
            <div class="row operator">-</div>

            <div class="row number">1</div>
            <div class="row number">2</div>
            <div class="row number">3</div>
            <div class="row operator">+</div>

            <div class="row number">00</div>
            <div class="row number">0</div>
            <div class="row number">.</div>
            <div class="row equal">=</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
